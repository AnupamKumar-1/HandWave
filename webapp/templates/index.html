<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HandWave — ASL Recognition</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div class="app">

  <header class="header">
    <div class="logo">
      <div class="logo-mark">Hand<span>Wave</span></div>
      <div class="logo-sub">ASL Recognition</div>
    </div>
    <div class="badge" id="status-badge">
      <span class="badge-dot" id="status-dot"></span>
      <span id="status-text">Ready</span>
    </div>
  </header>

  <section class="camera-panel">
    <div class="panel-title">Live Feed</div>
    <div class="video-wrap">
      <video id="video" width="640" height="480" autoplay muted playsinline></video>
      <canvas id="overlay" width="640" height="480"></canvas>
      <div class="video-placeholder" id="cam-placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.89L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        </svg>
        Camera not started
      </div>
    </div>

    <div class="pred-row">
      <div class="pred-letter-box">
        <div class="pred-letter" id="pred-letter">--</div>
        <div class="pred-meta">
          Detected letter
          <div class="confidence-track">
            <div class="confidence-fill" id="conf-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <button id="start-btn" style="display:none"></button>
    <button id="stop-btn"  style="display:none"></button>
    <button class="toggle-btn start" id="toggle-btn">Start Camera</button>
  </section>

  <section class="builder-panel">
    <div class="panel-title">Word Builder</div>

    <div class="builder-top">
      <div class="detected-box">
        <div class="detected-glyph" id="detected-glyph">—</div>
        <div class="detected-meta">
          <span class="meta-label">Current sign</span>
          <div class="hold-track" id="hold-track" style="display:none">
            <div class="hold-fill" id="hold-fill"></div>
          </div>
          <span class="meta-label" id="mode-hint" style="margin-top:2px">Press A to add</span>
        </div>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-manual" onclick="setMode('manual')">Manual</button>
        <button class="mode-btn" id="btn-hold" onclick="setMode('hold')">Hold</button>
      </div>
    </div>

    <div class="word-display" id="word-display">
      <span class="word-empty-hint" id="word-hint">Add letters to start building...</span>
      <span class="cursor-blink"></span>
    </div>

    <div class="action-row">
      <button class="act-btn" id="add-letter-btn">+ Add</button>
      <button class="act-btn" id="add-space-btn">Space</button>
      <button class="act-btn" id="undo-char-btn">Undo</button>
      <button class="act-btn" id="commit-word-btn">Commit</button>
      <button class="act-btn danger" id="clear-word-btn">Clear</button>
    </div>

    <div class="history-label">
      Sentence History
      <button class="history-clear-link" id="clear-history-btn">Clear all</button>
    </div>

    <div class="history-log" id="history-log">
      <div class="history-empty" id="history-empty">No sentences yet.</div>
    </div>

    <button class="copy-all-btn" id="copy-all-btn">Copy All</button>
  </section>

  <div class="shortcuts">
    <div class="shortcut-item"><kbd>A</kbd> Add letter</div>
    <div class="shortcut-item"><kbd>S</kbd> Space</div>
    <div class="shortcut-item"><kbd>Bksp</kbd> Undo</div>
    <div class="shortcut-item"><kbd>Enter</kbd> Commit word</div>
    <div class="shortcut-item"><kbd>Esc</kbd> Clear word</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
