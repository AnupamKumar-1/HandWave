<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ASL Recognition (Real-Time)</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-card {
      width: 100%;
      max-width: 680px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    h2 {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .status {
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    #video-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 8px auto;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: black;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    #video {
      display: none;
    }

    #overlay {
      width: 100%;
      height: 100%;
    }

    .toggle-btn {
      margin-top: 8px;
      border-radius: 10px;
      padding: 6px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      transition: 0.2s;
    }

    .start {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .toggle-btn:hover {
      transform: scale(1.05);
    }

    .prediction-box {
      margin-top: 8px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
    }

    .prediction-label {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .prediction-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #22c55e;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>

<body>

  <div class="main-card text-center">

   <h2>🤚 HandWave </h2>
    <p class="text-secondary small">Real-time hand gesture detection</p>

    <div class="status" id="status-text">
      <span class="dot"></span>
      Ready
    </div>


    <div id="video-container">
      <video id="video" width="640" height="480" autoplay muted playsinline></video>
      <canvas id="overlay" width="640" height="480"></canvas>
    </div>


    <div class="mt-2 d-flex justify-content-center gap-2">


      <button id="start-btn" style="display:none;"></button>
      <button id="stop-btn" style="display:none;"></button>

      <!-- Toggle button -->
      <button id="toggle-btn" class="toggle-btn start">
        ▶ Start Camera
      </button>

    </div>

    <!-- Prediction -->
    <div id="prediction-box" class="prediction-box" style="display: none;">
      <div class="prediction-label">Prediction</div>
      <div id="prediction" class="prediction-value">Waiting for hand…</div>
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>


  <script>
    const toggleBtn = document.getElementById("toggle-btn");
    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    const statusText = document.getElementById("status-text");

    let running = false;

    toggleBtn.addEventListener("click", () => {

      if (!running) {
        startBtn.click();

        toggleBtn.innerHTML = "⛔ Stop Camera";
        toggleBtn.classList.remove("start");
        toggleBtn.classList.add("stop");

        statusText.innerHTML = '<span class="dot"></span> Running';

        running = true;

      } else {
        stopBtn.click();

        toggleBtn.innerHTML = "▶ Start Camera";
        toggleBtn.classList.remove("stop");
        toggleBtn.classList.add("start");

        statusText.innerHTML = '<span class="dot"></span> Stopped';

        running = false;
      }

    });
  </script>

</body>
</html>
